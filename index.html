<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaccine Planner Bangladesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#EEF5FF;--bg2:#FFF0F7;--surface:#fff;--ink:#14264A;--mute:#5D6F8F;--blue:#2F6BFF;--blue-soft:#E3ECFF;--pink:#E8458B;--pink-soft:#FFE3EF;--line:#D8E3F8;--on-blue:#fff;--fh:Fredoka,"Hind Siliguri",system-ui,sans-serif;--fb:Nunito,"Hind Siliguri",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0E1A33;--bg2:#2A1230;--surface:#16264A;--ink:#EAF1FF;--mute:#A4B5D6;--blue:#7AA5FF;--blue-soft:#1F3466;--pink:#FF86BA;--pink-soft:#46204A;--line:#2B4272;--on-blue:#0B1630;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#0E1A33;--bg2:#2A1230;--surface:#16264A;--ink:#EAF1FF;--mute:#A4B5D6;--blue:#7AA5FF;--blue-soft:#1F3466;--pink:#FF86BA;--pink-soft:#46204A;--line:#2B4272;--on-blue:#0B1630;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font:400 16px/1.65 var(--fb)}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.2}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.hide{display:none!important}
.ctl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:40;display:flex;gap:8px}
.ctl button{font:600 .85rem var(--fh);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.splash{position:fixed;inset:0;z-index:30;background-color:var(--bg1);background-image:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:transform .7s cubic-bezier(.7,0,.3,1)}
.splash.out{transform:translateY(-100%)}
.syr{width:min(86vw,430px);animation:slide 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(-120vw)}to{transform:none}}
.plunger{animation:push 1.2s 1.1s ease-in-out both}
@keyframes push{to{transform:translateX(118px)}}
.liq{transform-box:fill-box;transform-origin:100% 50%;animation:shrink 1.2s 1.1s ease-in-out both}
@keyframes shrink{to{transform:scaleX(.18)}}
.drop{opacity:0;animation:drip 1s 2.1s ease-in both}
@keyframes drip{0%{opacity:0;transform:translateY(-4px) scale(.4)}25%{opacity:1;transform:none}100%{opacity:0;transform:translateY(34px)}}
.intro>*{opacity:0;animation:rise .6s ease forwards}
.intro h1{font-size:clamp(2rem,8vw,3.4rem);color:var(--blue);animation-delay:2s}
.intro h2{font-size:clamp(1.6rem,6.5vw,2.7rem);color:var(--pink);margin-top:4px;animation-delay:2.3s}
.intro p{max-width:34ch;margin:16px auto 24px;color:var(--mute);font-size:1.08rem;animation-delay:2.5s}
.intro .btn{animation-delay:2.7s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.syr,.plunger,.liq,.drop,.intro>*{animation:none;opacity:1}.plunger{transform:translateX(118px)}.liq{transform:scaleX(.18)}.drop{opacity:0}}
.btn{font:600 1.05rem var(--fh);border:0;border-radius:999px;padding:14px 32px;background:var(--blue);color:var(--on-blue);cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.ghost{font:600 .95rem var(--fh);border:2px solid var(--pink);background:transparent;color:var(--pink);border-radius:999px;padding:11px 20px;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.top{padding:44px 0 8px}
.brand{display:inline-block;background:var(--pink-soft);color:var(--pink);font:600 .9rem var(--fh);padding:4px 14px;border-radius:999px}
.top h1{font-size:clamp(2rem,7vw,3rem);margin-top:12px}
.pk{color:var(--pink)}
.top p{color:var(--mute);margin:10px 0 0;max-width:48ch}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.nav button{font:600 .9rem var(--fh);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.nav button:nth-child(2){border-color:var(--pink);color:var(--pink)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px;margin-top:20px}
.card h3{font-size:1.2rem}
label{font-weight:700;display:block;margin-bottom:6px}
input[type=date],input[type=text],select{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg1);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.row2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr}}
.chk{display:flex;gap:10px;align-items:center;margin:14px 0 18px}
.chk input{width:20px;height:20px;accent-color:var(--pink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--pink);font-weight:700;margin-top:10px;min-height:1.4em}
.kids{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.kid{font:600 .95rem var(--fh);border:2px solid var(--line);background:var(--bg1);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.kid[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.kid.add{border:2px dashed var(--pink);color:var(--pink);background:transparent}
.rh{font-size:1.5rem;margin-top:26px;color:var(--blue)}
.prog{display:flex;align-items:center;gap:12px;margin-top:12px;font-weight:700}
.bar{flex:1;height:12px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink));border-radius:999px}
.next{margin-top:18px;background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;border-radius:24px;padding:22px}
.next small{opacity:.92;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.next h2{font-size:1.6rem;margin:6px 0 4px}
.next .chips span{background:rgba(255,255,255,.25);color:#fff}
.ov{margin-top:8px;font-weight:700;background:rgba(255,255,255,.22);padding:6px 12px;border-radius:12px;display:inline-block}
.note{margin-top:14px;color:var(--mute);font-size:.93rem}
.tl{margin-top:18px}
.m{display:grid;grid-template-columns:78px 1fr;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.m.done{opacity:.68}
.m.nx,.m.over{border-color:var(--pink)}
.m.nx{box-shadow:0 0 0 4px var(--pink-soft)}
.when{background:var(--blue-soft);border-radius:16px;text-align:center;padding:8px 4px;align-self:start}
.nx .when,.over .when{background:var(--pink-soft)}
.dd{font:700 1.7rem var(--fh);line-height:1.1;color:var(--blue)}
.nx .dd,.over .dd{color:var(--pink)}
.mo{font-weight:700;font-size:.85rem}
.yr{font-size:.78rem;color:var(--mute)}
.m h3{font-size:1.15rem}
.day{color:var(--mute);font-weight:600;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chips span{background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:.85rem;padding:3px 11px;border-radius:999px}
.nx .chips span{background:var(--pink-soft);color:var(--pink)}
.prot{font-size:.92rem;color:var(--mute)}
.st{margin-top:8px;font-weight:700;font-size:.9rem;color:var(--blue)}
.nx .st,.over .st{color:var(--pink)}
.mk{margin-top:10px;font:600 .9rem var(--fh);border:2px solid var(--blue);background:transparent;color:var(--blue);border-radius:999px;padding:6px 16px;cursor:pointer}
.nx .mk,.over .mk{border-color:var(--pink);color:var(--pink)}
.done .mk{border-color:var(--line);color:var(--mute)}
.zone{margin-top:40px}
.zone>h2{font-size:1.7rem;color:var(--pink)}
#help>h2{color:var(--blue)}
.lead{color:var(--mute);max-width:56ch;margin:8px 0 0}
.tdl{list-style:none;padding:0;margin:14px 0 0}.tdl li{padding:8px 0;border-top:1px dashed var(--line)}
.dg{display:flex;gap:10px;align-items:flex-start;font-weight:600;padding:6px 0;margin:0}
.dg input{width:20px;height:20px;margin-top:4px;accent-color:var(--pink)}
.alert{margin-top:14px;background:var(--pink);color:#fff;border-radius:16px;padding:14px 16px}
.alert a{color:#fff;font-weight:700}
.okbox{margin-top:14px;background:var(--blue-soft);border-radius:16px;padding:14px 16px}
.hl{display:grid;gap:12px;margin-top:14px}
.hc{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.hc a{flex:none;font:700 1.35rem var(--fh);background:var(--blue);color:var(--on-blue);border-radius:14px;padding:8px 14px;text-decoration:none}
.hc b{display:block}.hc span{color:var(--mute);font-size:.92rem}
footer{padding:20px 0 50px;color:var(--mute);font-size:.9rem}
</style>
</head>
<body class="lock">
<div class="ctl"><button id="lang" type="button">বাংলা</button><button id="theme" type="button">Dark mode</button></div>

<div class="splash" id="splash">
<svg class="syr" viewBox="0 0 360 120" aria-hidden="true">
<line x1="262" y1="60" x2="338" y2="60" stroke="#8FA6CC" stroke-width="3" stroke-linecap="round"/>
<rect x="238" y="50" width="26" height="20" rx="4" fill="#2F6BFF"/>
<rect x="80" y="38" width="160" height="44" rx="8" fill="#fff" stroke="#2F6BFF" stroke-width="4"/>
<rect class="liq" x="86" y="44" width="148" height="32" rx="4" fill="#FF5FA2"/>
<g stroke="#2F6BFF" stroke-width="2" opacity=".6"><line x1="130" y1="38" x2="130" y2="48"/><line x1="160" y1="38" x2="160" y2="48"/><line x1="190" y1="38" x2="190" y2="48"/><line x1="220" y1="38" x2="220" y2="48"/></g>
<rect x="70" y="28" width="8" height="64" rx="4" fill="#2F6BFF"/>
<g class="plunger"><rect x="10" y="56" width="72" height="8" fill="#2F6BFF"/><rect x="0" y="38" width="12" height="44" rx="6" fill="#2F6BFF"/><rect x="80" y="44" width="10" height="32" rx="2" fill="#1B47B8"/></g>
<circle class="drop" cx="340" cy="66" r="5" fill="#FF5FA2"/>
</svg>
<div class="intro"><h1 data-t="A tiny prick today.|আজ ছোট্ট একটি সুচ।"></h1><h2 data-t="A lifetime of protection.|সারা জীবনের সুরক্ষা।"></h2><p data-t="Enter your baby’s birth date and see exactly which vaccine is due, and on which day.|আপনার শিশুর জন্মতারিখ দিন, দেখুন কোন দিন কোন ভ্যাকসিন দিতে হবে।"></p><button class="btn" id="enter" type="button" data-t="Check the schedule|সময়সূচি দেখুন"></button></div>
</div>

<header class="top" id="top"><div class="wrap">
<span class="brand" data-t="Vaccine Planner · Bangladesh|ভ্যাকসিন প্ল্যানার · বাংলাদেশ"></span>
<h1><span data-t="When is my baby’s |আমার শিশুর "></span><span class="pk" data-t="next vaccine?|পরবর্তী ভ্যাকসিন কবে?"></span></h1>
<p data-t="Add one or more children. We list every routine EPI vaccine with its date and weekday, and you can mark each one done.|এক বা একাধিক শিশু যোগ করুন। আমরা প্রতিটি নিয়মিত ইপিআই ভ্যাকসিনের তারিখ ও বার দেখাব, আর আপনি প্রতিটি হয়েছে বলে চিহ্নিত করতে পারবেন।"></p>
<nav class="nav"><button type="button" data-go="top" data-t="Baby vaccines|শিশুর ভ্যাকসিন"></button><button type="button" data-go="mother" data-t="Pregnant mother|গর্ভবতী মা"></button><button type="button" data-go="help" data-t="Helplines|হেল্পলাইন"></button></nav>
<div class="card">
<div class="kids hide" id="kids"></div>
<div class="row2"><div><label for="kn" data-t="Child’s name|শিশুর নাম"></label><input id="kn" type="text" maxlength="30" data-p="e.g. Rafi|যেমন: রাফি"></div><div><label for="dob" data-t="Date of birth|জন্মতারিখ"></label><input id="dob" type="date"></div></div>
<div class="chk"><input id="girl" type="checkbox"><label for="girl" style="margin:0" data-t="This child is a girl (also show HPV)|শিশুটি মেয়ে (HPV-ও দেখান)"></label></div>
<div class="btns"><button class="btn" id="go" type="button" data-t="Show schedule|সময়সূচি দেখুন"></button><button class="ghost hide" id="rm" type="button" data-t="Remove this child|এই শিশুকে মুছুন"></button></div>
<div class="err" id="err" role="alert"></div>
<p class="note" style="margin-top:6px" data-t="Names and dates are saved only on this device.|নাম ও তারিখ শুধু এই ডিভাইসে সংরক্ষিত থাকে।"></p>
</div>
</div></header>

<main class="wrap">
<div id="out" class="hide" aria-live="polite"></div>

<section class="zone" id="mother"><h2 data-t="Pregnant mother’s zone|গর্ভবতী মায়ের জোন"></h2>
<p class="lead" data-t="The routine EPI vaccine for women aged 15 to 49 is Td (tetanus and diphtheria). Five doses protect you and your newborn from tetanus.|১৫ থেকে ৪৯ বছর বয়সী নারীদের নিয়মিত ইপিআই ভ্যাকসিন হলো Td (ধনুষ্টংকার ও ডিপথেরিয়া)। পাঁচ ডোজ আপনাকে ও নবজাতককে ধনুষ্টংকার থেকে রক্ষা করে।"></p>
<div class="card"><h3 data-t="Your Td plan in pregnancy|গর্ভাবস্থায় আপনার Td পরিকল্পনা"></h3>
<label for="tdh" style="margin-top:10px" data-t="Your tetanus vaccine history|আপনার টিটেনাস ভ্যাকসিনের ইতিহাস"></label>
<select id="tdh"><option value="n" data-t="I have never had Td or TT|আমি কখনো Td বা TT নিইনি"></option><option value="s" data-t="I had 1 or 2 doses before|আগে ১ বা ২ ডোজ নিয়েছি"></option><option value="f" data-t="I completed all 5 doses|আমার ৫ ডোজই সম্পূর্ণ"></option></select>
<div class="okbox" id="tdg"></div>
<div id="tdw"><label for="td1" style="margin-top:14px" data-t="Date of your first Td dose in this series (leave empty if not taken yet)|এই সিরিজের প্রথম Td ডোজের তারিখ (না নিলে ফাঁকা রাখুন)"></label><input id="td1" type="date"><ul class="tdl" id="tdout"></ul></div>
<p class="note" data-t="Source: guidance for pregnant mothers from a Bangladesh government family planning office (page last updated 2018). Global advice allows the first dose earlier in pregnancy, so always follow your own health worker or doctor. Dates shown are the earliest allowed gaps.|উৎস: বাংলাদেশ সরকারের একটি পরিবার পরিকল্পনা কার্যালয়ের গর্ভবতী মায়ের নির্দেশিকা (পাতাটি ২০১৮ সালে হালনাগাদ)। বিশ্বব্যাপী পরামর্শে প্রথম ডোজ গর্ভাবস্থার আরও আগেও দেওয়া যায়, তাই সবসময় নিজের স্বাস্থ্যকর্মী বা ডাক্তারের কথা মানুন। দেখানো তারিখগুলো সবচেয়ে আগের অনুমোদিত ব্যবধান।"></p></div>
<div class="card"><h3 data-t="Danger signs checker|বিপদ-চিহ্ন যাচাই"></h3><p class="lead" style="margin:0 0 8px" data-t="Tick anything that is happening right now.|এই মুহূর্তে যা হচ্ছে তা টিক দিন।"></p><div id="dl"></div><div id="dres"></div><p class="note" data-t="This is not a diagnosis. If you feel something is wrong, get care even if nothing is ticked.|এটি রোগ নির্ণয় নয়। কিছু ঠিক না লাগলে কিছু টিক না দিলেও চিকিৎসা নিন।"></p></div></section>

<section class="zone" id="help"><h2 data-t="Helplines|হেল্পলাইন"></h2><div class="hl" id="hl"></div><p class="note" data-t="Numbers were taken from public government pages and may change. The 16263 service has faced funding problems, so it may not always connect. In an emergency call 999 or go to the nearest hospital.|নম্বরগুলো সরকারি পাতা থেকে নেওয়া এবং বদলাতে পারে। ১৬২৬৩ সেবাটি তহবিল সংকটে পড়েছিল, তাই সবসময় সংযোগ নাও পেতে পারেন। জরুরি অবস্থায় ৯৯৯-এ কল করুন বা নিকটতম হাসপাতালে যান।"></p></section>

<footer>
<p data-t="Based on the routine EPI schedule of Bangladesh: BCG at birth; Penta, OPV and PCV at 6, 10 and 14 weeks; IPV at 6 and 14 weeks; MR at 9 and 15 months; TCV (typhoid) at 9 months; HPV for girls aged 10 to 14; Td for women aged 15 to 49. Routine EPI vaccines are free at government centres.|বাংলাদেশের নিয়মিত ইপিআই সূচির ভিত্তিতে: জন্মের সময় BCG; ৬, ১০ ও ১৪ সপ্তাহে Penta, OPV ও PCV; ৬ ও ১৪ সপ্তাহে IPV; ৯ ও ১৫ মাসে MR; ৯ মাসে TCV (টাইফয়েড); ১০ থেকে ১৪ বছরের মেয়েদের HPV; ১৫ থেকে ৪৯ বছর বয়সী নারীদের Td। নিয়মিত ইপিআই ভ্যাকসিন সরকারি কেন্দ্রে বিনামূল্যে।"></p>
<p data-t="Session days differ by centre, so please ask your health worker which day your nearest centre vaccinates. If a dose is missed, visit the nearest centre as soon as possible. This page is a reminder tool, not medical advice. Keep your vaccine card safe.|কেন্দ্রভেদে টিকাদানের দিন আলাদা, তাই আপনার নিকটতম কেন্দ্র কোন দিন টিকা দেয় তা স্বাস্থ্যকর্মীকে জিজ্ঞেস করুন। কোনো ডোজ বাদ পড়লে যত দ্রুত সম্ভব নিকটতম কেন্দ্রে যান। এই পাতাটি স্মরণ করানোর টুল, চিকিৎসা পরামর্শ নয়। ভ্যাকসিন কার্ড যত্নে রাখুন।"></p>
</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const NB="০১২৩৪৫৬৭৮৯";
let S={lang:"en",cur:-1,kids:[],mom:{h:"n",d:""}};
try{const s=JSON.parse(localStorage.getItem("vp_state")||"{}");if(s&&typeof s==="object")S=Object.assign(S,s)}catch(e){}
if(!Array.isArray(S.kids))S.kids=[];
S.cur=S.kids.length?Math.min(Math.max(S.cur,0),S.kids.length-1):-1;
const save=()=>{try{localStorage.setItem("vp_state",JSON.stringify(S))}catch(e){}};
const bn=()=>S.lang==="bn",L=(e,b)=>bn()?b:e;
const nm=n=>bn()?String(n).replace(/\d/g,d=>NB[d]):String(n);
const fmt=(d,o)=>d.toLocaleDateString(bn()?"bn-BD":"en-GB",o);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FD={weekday:"long",day:"numeric",month:"long",year:"numeric"};
function addD(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function addM(d,n){const r=new Date(d.getFullYear(),d.getMonth()+n,1);r.setDate(Math.min(d.getDate(),new Date(r.getFullYear(),r.getMonth()+1,0).getDate()));return r}
const MS=[
{id:"birth",e:"At birth",b:"জন্মের সময়",f:b=>b,v:["BCG"]},
{id:"w6",e:"6 weeks",b:"৬ সপ্তাহ",f:b=>addD(b,42),v:["Penta-1","OPV-1","PCV-1","IPV-1"]},
{id:"w10",e:"10 weeks",b:"১০ সপ্তাহ",f:b=>addD(b,70),v:["Penta-2","OPV-2","PCV-2"]},
{id:"w14",e:"14 weeks",b:"১৪ সপ্তাহ",f:b=>addD(b,98),v:["Penta-3","OPV-3","PCV-3","IPV-2"]},
{id:"m9",e:"9 months",b:"৯ মাস",f:b=>addM(b,9),v:["MR-1","TCV"]},
{id:"m15",e:"15 months",b:"১৫ মাস",f:b=>addM(b,15),v:["MR-2"]},
{id:"hpv",e:"10 years (girls, grades 5 to 9)",b:"১০ বছর (মেয়েদের, ৫ম–৯ম শ্রেণি)",f:b=>addM(b,120),v:["HPV"],g:1}];
const PROT={BCG:["Tuberculosis","যক্ষ্মা"],Penta:["Diphtheria, tetanus, whooping cough, hepatitis B and Hib","ডিপথেরিয়া, ধনুষ্টংকার, হুপিং কাশি, হেপাটাইটিস বি ও হিব"],OPV:["Polio (drops)","পোলিও (ফোঁটা)"],IPV:["Polio (injection)","পোলিও (ইনজেকশন)"],TCV:["Typhoid","টাইফয়েড"],PCV:["Pneumonia","নিউমোনিয়া"],MR:["Measles and rubella","হাম ও রুবেলা"],HPV:["Cervical cancer","জরায়ুমুখ ক্যান্সার"]};
function when(n){if(n===0)return L("today","আজ");if(n===1)return L("tomorrow","আগামীকাল");if(n<=45)return L("in "+n+" days",nm(n)+" দিন পরে");if(n<700){const m=Math.round(n/30.4);return L("in about "+m+" months","প্রায় "+nm(m)+" মাস পরে")}const y=Math.round(n/365);return L("in about "+y+" years","প্রায় "+nm(y)+" বছর পরে")}

function renderResult(){const o=$("out"),k=S.kids[S.cur];if(!k){o.classList.add("hide");return}
const [y,m,d]=k.dob.split("-").map(Number),b=new Date(y,m-1,d),t=new Date();t.setHours(0,0,0,0);
const list=MS.filter(x=>!x.g||k.girl).map(x=>({...x,d:x.f(b),done:!!k.done[x.id]}));
list.forEach(x=>x.n=Math.round((x.d-t)/864e5));
const nx=list.find(x=>!x.done),nd=list.filter(x=>x.done).length,lb=x=>bn()?x.b:x.e,vs=x=>x.v.map(v=>`<span>${v}</span>`).join("");
let h=`<h2 class="rh">${esc(k.name)}${L("’s schedule","-এর সময়সূচি")}</h2><div class="prog"><div class="bar"><i style="width:${Math.round(nd/list.length*100)}%"></i></div><span>${L(nd+" of "+list.length+" done",nm(list.length)+" টির মধ্যে "+nm(nd)+" টি হয়েছে")}</span></div>`;
if(nx){const od=nx.n<0;h+=`<section class="next"><small>${od?L("Pending","বাকি আছে"):nx.n===0?L("Due today","আজ দিতে হবে"):L("Next vaccine","পরবর্তী ভ্যাকসিন")}</small><h2>${fmt(nx.d,FD)}</h2><div>${lb(nx)} · ${od?L("date passed "+(-nx.n)+" days ago",nm(-nx.n)+" দিন আগে তারিখ পেরিয়েছে"):when(nx.n)}</div><div class="chips">${vs(nx)}</div>${od?`<div class="ov">${L("Missed? Visit the nearest EPI centre as soon as possible.","বাদ পড়েছে? যত দ্রুত সম্ভব নিকটতম ইপিআই কেন্দ্রে যান।")}</div>`:""}</section>`}
else h+=`<section class="next"><small>${L("All done","সব হয়েছে")}</small><h2>${L("Every routine dose is marked done","সব নিয়মিত ডোজ হয়েছে বলে চিহ্নিত")}</h2><div>${L("Great job! Keep the vaccine card safe.","চমৎকার! ভ্যাকসিন কার্ড যত্নে রাখুন।")}</div></section>`;
h+=`<div class="tl">`+list.map(x=>{const c=x.done?"done":x===nx?"nx":x.n<0?"over":"",st=x.done?L("Done","হয়েছে"):x.n<0?L("Pending · date passed","বাকি · তারিখ পেরিয়েছে"):x===nx?L("Next up · ","পরবর্তী · ")+when(x.n):L("Upcoming · ","আসছে · ")+when(x.n),pr=[...new Set(x.v.map(v=>v.split("-")[0]))].map(v=>PROT[v][bn()?1:0]).join(" · ");
return`<article class="m ${c}"><div class="when"><div class="dd">${nm(x.d.getDate())}</div><div class="mo">${fmt(x.d,{month:"short"})}</div><div class="yr">${nm(x.d.getFullYear())}</div></div><div><h3>${lb(x)}</h3><div class="day">${fmt(x.d,{weekday:"long"})}</div><div class="chips">${vs(x)}</div><div class="prot">${L("Protects against: ","সুরক্ষা দেয়: ")}${pr}</div><div class="st">${st}</div><button class="mk" data-id="${x.id}" type="button">${x.done?L("Mark as pending","আবার বাকি করুন"):L("Mark as done","হয়েছে চিহ্নিত করুন")}</button></div></article>`}).join("")+`</div>`;
o.innerHTML=h;o.classList.remove("hide");
o.querySelectorAll(".mk").forEach(bt=>bt.onclick=()=>{k.done[bt.dataset.id]=!k.done[bt.dataset.id];save();renderResult()})}

function loadForm(){const k=S.kids[S.cur];$("kn").value=k?k.name:"";$("dob").value=k?k.dob:"";$("girl").checked=k?!!k.girl:false;$("rm").classList.toggle("hide",!k);$("err").textContent=""}
function renderKids(){const c=$("kids");c.innerHTML="";
S.kids.forEach((k,i)=>{const b=document.createElement("button");b.type="button";b.className="kid";b.textContent=k.name;b.setAttribute("aria-pressed",i===S.cur);b.onclick=()=>{S.cur=i;save();renderKids();loadForm();renderResult()};c.appendChild(b)});
if(S.kids.length){const a=document.createElement("button");a.type="button";a.className="kid add";a.textContent=L("+ Add another child","+ আরেকটি শিশু যোগ করুন");a.onclick=()=>{S.cur=-1;renderKids();loadForm();$("out").classList.add("hide");$("kn").focus()};c.appendChild(a)}
c.classList.toggle("hide",!S.kids.length)}
$("dob").max=(()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")})();
$("go").onclick=()=>{const v=$("dob").value,e=$("err");e.textContent="";
if(!v){e.textContent=L("Please choose a birth date.","জন্মতারিখ বেছে নিন।");return}
const [y,m,d]=v.split("-").map(Number);if(new Date(y,m-1,d)>new Date()){e.textContent=L("The birth date cannot be in the future.","জন্মতারিখ ভবিষ্যতের হতে পারবে না।");return}
const name=$("kn").value.trim()||L("Baby ","শিশু ")+nm((S.cur>=0?S.cur:S.kids.length)+1);
if(S.cur>=0){const k=S.kids[S.cur];if(k.dob!==v)k.done={};k.name=name;k.dob=v;k.girl=$("girl").checked}
else{S.kids.push({name,dob:v,girl:$("girl").checked,done:{}});S.cur=S.kids.length-1}
save();renderKids();loadForm();renderResult();$("out").scrollIntoView({behavior:"smooth",block:"start"})};
let rmT=0;
$("rm").onclick=()=>{const b=$("rm");if(!rmT){b.textContent=L("Tap again to confirm","নিশ্চিত করতে আবার চাপুন");rmT=setTimeout(()=>{rmT=0;applyLang()},3000);return}
clearTimeout(rmT);rmT=0;S.kids.splice(S.cur,1);S.cur=S.kids.length?0:-1;save();renderKids();loadForm();renderResult();applyLang()};

const TDG={n:["Never had Td or TT: take two doses in this pregnancy. The first after the 5th month (20 weeks), the second at least 1 month later. The remaining doses follow later, at the gaps shown below.","কখনো Td বা TT না নিলে: এই গর্ভাবস্থায় দুই ডোজ নিন। প্রথমটি ৫ মাস (২০ সপ্তাহ) পরে, দ্বিতীয়টি অন্তত ১ মাস পরে। বাকি ডোজগুলো পরে, নিচের ব্যবধানে।"],s:["Had 1 or 2 doses before: take one booster dose in each pregnancy. Ask your health worker which dose number you are on.","আগে ১ বা ২ ডোজ নিয়ে থাকলে: প্রতি গর্ভাবস্থায় একটি বুস্টার ডোজ নিন। আপনি কত নম্বর ডোজে আছেন তা স্বাস্থ্যকর্মীকে জিজ্ঞেস করুন।"],f:["Completed all 5 doses: no dose is needed in pregnancy. A doctor may still advise a booster, so tell your health worker.","৫ ডোজই সম্পূর্ণ হলে: গর্ভাবস্থায় আর ডোজ লাগে না। ডাক্তার তবু বুস্টার বলতে পারেন, তাই স্বাস্থ্যকর্মীকে জানান।"]};
const TDL=[["after the 5th month (20 weeks) of pregnancy, if you have had none","at least 4 weeks after Td-1","at least 6 months after Td-2","at least 1 year after Td-3","at least 1 year after Td-4"],["আগে কিছু না নিলে গর্ভাবস্থার ৫ মাস (২০ সপ্তাহ) পরে","Td-১ এর কমপক্ষে ৪ সপ্তাহ পরে","Td-২ এর অন্তত ৬ মাস পরে","Td-৩ এর অন্তত ১ বছর পরে","Td-৪ এর অন্তত ১ বছর পরে"]];
function tdShow(){const h=$("tdh").value,v=$("td1").value,o=$("tdout");S.mom={h,d:v};save();
$("tdg").textContent=TDG[h][bn()?1:0];$("tdw").classList.toggle("hide",h==="f");
const nmd=i=>"Td-"+nm(i+1);
if(!v){o.innerHTML=TDL[bn()?1:0].map((x,i)=>`<li><b>${nmd(i)}</b> ${x}</li>`).join("");return}
const [y,m,d]=v.split("-").map(Number),t1=new Date(y,m-1,d),t2=addD(t1,28),t3=addM(t2,6),t4=addM(t3,12),t5=addM(t4,12),f=x=>fmt(x,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
o.innerHTML=`<li><b>${nmd(0)}</b> ${f(t1)} ${L("(first dose)","(প্রথম ডোজ)")}</li>`+[t2,t3,t4,t5].map((x,i)=>`<li><b>${nmd(i+1)}</b> ${L("from ","")}${f(x)}${L(""," থেকে")}</li>`).join("")}
$("td1").addEventListener("input",tdShow);$("tdh").addEventListener("change",tdShow);

const DG=[["Bleeding from the vagina","যোনিপথে রক্তক্ষরণ"],["Severe headache, blurred vision, or swelling of the face and hands","তীব্র মাথাব্যথা, ঝাপসা দেখা, বা মুখ ও হাত ফুলে যাওয়া"],["Fits (convulsions) or fainting","খিঁচুনি বা অজ্ঞান হয়ে যাওয়া"],["High fever or feeling very unwell","তীব্র জ্বর বা খুব অসুস্থ লাগা"],["Severe belly pain","পেটে তীব্র ব্যথা"],["Baby is moving much less, or has stopped moving","শিশু অনেক কম নড়ছে বা একেবারে নড়ছে না"],["Water breaking or fluid leaking before labour","প্রসবের আগে পানি ভাঙা বা তরল বের হওয়া"],["Labour pains too early (before 8 months)","সময়ের আগে প্রসব ব্যথা (৮ মাসের আগে)"],["Difficulty breathing","শ্বাসকষ্ট"],["Vomiting so much that nothing stays down","এত বমি যে কিছুই পেটে থাকছে না"]];
function dcheck(){const n=document.querySelectorAll("#dl input:checked").length;
$("dres").innerHTML=n?`<div class="alert"><b>${L("This can be dangerous for mother and baby.","এটি মা ও শিশুর জন্য বিপজ্জনক হতে পারে।")}</b> ${L('Go to the nearest hospital now. Call <a href="tel:999">999</a> for an ambulance or <a href="tel:16263">16263</a> for doctor advice. Do not wait for it to get better.','এখনই নিকটতম হাসপাতালে যান। অ্যাম্বুলেন্সের জন্য <a href="tel:999">999</a> বা ডাক্তারের পরামর্শের জন্য <a href="tel:16263">16263</a> নম্বরে কল করুন। ভালো হওয়ার অপেক্ষায় থাকবেন না।')}</div>`:`<div class="okbox">${L("No danger sign ticked. Keep going to your regular antenatal check-ups, and call 16263 if you are worried.","কোনো বিপদ-চিহ্ন টিক দেওয়া হয়নি। নিয়মিত গর্ভকালীন চেকআপে যান, দুশ্চিন্তা হলে 16263-এ কল করুন।")}</div>`}
function renderDanger(){const c=[...document.querySelectorAll("#dl input")].map(i=>i.checked);
$("dl").innerHTML=DG.map((x,i)=>`<label class="dg"><input type="checkbox" ${c[i]?"checked":""}><span>${x[bn()?1:0]}</span></label>`).join("");dcheck()}
$("dl").addEventListener("change",dcheck);
const HL=[["999","National emergency","জাতীয় জরুরি সেবা","Police, fire service and ambulance, any hour.","পুলিশ, ফায়ার সার্ভিস ও অ্যাম্বুলেন্স, যেকোনো সময়।"],["16263","Shastho Batayon","স্বাস্থ্য বাতায়ন","Doctor advice by phone, 24 hours. Call charges may apply.","ফোনে ডাক্তারের পরামর্শ, ২৪ ঘণ্টা। কল চার্জ প্রযোজ্য হতে পারে।"],["1098","Child Helpline","শিশু হেল্পলাইন","For a child in danger, or an adult calling about a child.","বিপদে থাকা শিশুর জন্য, বা শিশুর বিষয়ে প্রাপ্তবয়স্কের কলের জন্য।"],["109","National Helpline","জাতীয় হেল্পলাইন","Violence against women and children. Toll free.","নারী ও শিশু নির্যাতনের বিষয়ে। টোল ফ্রি।"],["333","Government information","সরকারি তথ্য","How to find government services. Not a medical line.","সরকারি সেবা কীভাবে পাবেন। এটি চিকিৎসা লাইন নয়।"]];
const renderHelp=()=>{$("hl").innerHTML=HL.map(h=>`<div class="hc"><a href="tel:${h[0]}">${h[0]}</a><div><b>${bn()?h[2]:h[1]}</b><span>${bn()?h[4]:h[3]}</span></div></div>`).join("")};

const root=document.documentElement;
const dark=()=>root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
const labTheme=()=>{$("theme").textContent=dark()?L("Light mode","লাইট মোড"):L("Dark mode","ডার্ক মোড")};
try{const s=localStorage.getItem("vp_theme");if(s)root.dataset.theme=s}catch(e){}
$("theme").onclick=()=>{const n=dark()?"light":"dark";root.dataset.theme=n;try{localStorage.setItem("vp_theme",n)}catch(e){}labTheme()};
function applyLang(){const i=bn()?1:0;root.lang=bn()?"bn":"en";document.title=L("Vaccine Planner Bangladesh","ভ্যাকসিন প্ল্যানার বাংলাদেশ");
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=e.dataset.t.split("|")[i]);
document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=e.dataset.p.split("|")[i]);
$("lang").textContent=bn()?"English":"বাংলা";labTheme();renderKids();renderResult();tdShow();renderDanger();renderHelp()}
$("lang").onclick=()=>{S.lang=bn()?"en":"bn";save();applyLang()};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:"smooth",block:"start"}));
